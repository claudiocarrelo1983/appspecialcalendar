plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.specialcalendarhealth'
version = '1.0.0'
android {
  namespace 'expo.modules.specialcalendarhealth'
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName project.version.toString()
  }
}
dependencies {
  implementation 'androidx.health.connect:connect-client:1.1.0'
}
